name: Générer l'arbre depuis Gramps

# Régénère les data*.json dès qu'un GEDCOM, les compléments, la liste des arbres ou les scripts changent.
on:
  push:
    branches: [main]
    paths:
      - "gedcom/**"
      - "complements*.json"
      - "arbres.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convertir les GEDCOM (arbres.json)
        run: python3 scripts/ged2json.py | tee rapport.txt

      - name: Résumé
        run: |
          echo '### Génération de l’arbre' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat rapport.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer les données si elles ont changé
        run: |
          if git diff --quiet -- 'data*.json'; then
            echo "Données inchangées"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data*.json
          git commit -m "Régénère les données de l'arbre depuis le GEDCOM"
          git push
